# Hashed build assets never change; everything else (index.html, sw.js, manifest, icons) is revalidated
# on every request so a new deployment reaches the service worker's update check immediately.
map $uri $gt_cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_vary on;
  absolute_redirect off;
  gzip_types text/css application/javascript text/javascript application/manifest+json image/svg+xml;

  add_header Cache-Control $gt_cache_control; # not 'always': error responses must not be cached as immutable
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  # The full policy ships as a <meta> tag in index.html (see build/csp-plugin.ts); only frame-ancestors needs a header.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location = /manifest.webmanifest { default_type application/manifest+json; }
  location / { try_files $uri $uri/ =404; }
}
